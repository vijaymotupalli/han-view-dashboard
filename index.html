<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Han View trade dashboard with Cary market sentiment — research tool, not financial advice." />
  <meta name="color-scheme" content="dark" />
  <title>Han View Dashboard</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./market.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <img src="./favicon.svg" alt="" width="28" height="28" />
      <div>
        <h1>Han View</h1>
        <p class="tagline">Market pulse + trades</p>
      </div>
    </div>
    <div class="header-meta">
      <span id="feed-badge" class="feed-badge" title="Data from Cary market intelligence + Han View">Live feeds</span>
      <span id="generated-badge" class="meta-chip">Loading...</span>
    </div>
  </header>

  <main>
    <section id="loading" class="panel loading-panel" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading <code>data/market.json</code> + <code>data/latest.json</code>...</p>
    </section>

    <section id="error" class="panel error-panel" hidden>
      <h2>Could not load dashboard data</h2>
      <p id="error-message"></p>
    </section>

    <div id="app" hidden>
      <nav class="tab-bar" role="tablist" aria-label="Dashboard sections">
        <button type="button" class="tab-btn" role="tab" id="tab-btn-market" aria-controls="panel-market" aria-selected="false" data-tab="market">Market</button>
        <button type="button" class="tab-btn" role="tab" id="tab-btn-stocks" aria-controls="panel-stocks" aria-selected="false" data-tab="stocks">Stocks</button>
      </nav>

      <section id="panel-market" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-market" hidden>
        <div id="market-root"></div>
      </section>

      <section id="panel-stocks" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-stocks" hidden>
        <div id="stocks-root"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer panel">
    <div id="footer-meta"></div>
    <p class="disclaimer">Not financial advice. For research and educational purposes only. Trading involves risk of loss.</p>
  </footer>

  <script src="./lib.js"></script>
  <script src="./market.js"></script>
  <script src="./stocks.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
